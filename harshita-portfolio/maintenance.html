<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Maintenance page for the portfolio site." />
  <title>Under Maintenance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d0d0d;
      --panel: rgba(255, 255, 255, 0.04);
      --panel-border: rgba(255, 255, 255, 0.1);
      --text: #f5f1ea;
      --muted: rgba(245, 241, 234, 0.7);
      --accent: #e6a86b;
      --accent-soft: rgba(230, 168, 107, 0.18);
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, rgba(230, 168, 107, 0.12), transparent 30%),
        radial-gradient(circle at bottom right, rgba(255, 255, 255, 0.05), transparent 32%),
        var(--bg);
      color: var(--text);
      font-family: "DM Sans", system-ui, sans-serif;
      overflow: hidden;
    }

    .noise {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.18;
      background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
    }

    .page {
      width: min(920px, calc(100vw - 32px));
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 32px;
      align-items: center;
      padding: 28px;
      border: 1px solid var(--panel-border);
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
      position: relative;
      z-index: 1;
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 16px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.04);
      pointer-events: none;
    }

    .copy {
      padding: 12px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid var(--panel-border);
      background: rgba(255,255,255,0.03);
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .eyebrow::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 0 8px var(--accent-soft);
    }

    h1 {
      margin: 0;
      font-family: "DM Serif Display", Georgia, serif;
      font-size: clamp(3rem, 7vw, 5.4rem);
      line-height: 0.95;
      letter-spacing: -0.03em;
    }

    .lead {
      margin: 18px 0 0;
      font-size: clamp(1.05rem, 2vw, 1.25rem);
      line-height: 1.7;
      color: var(--muted);
      max-width: 34rem;
    }

    .lead strong {
      color: var(--text);
      font-weight: 700;
    }

    .note {
      margin-top: 18px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      font-size: 0.95rem;
    }

    .note span {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 6px var(--accent-soft);
      animation: pulse 1.8s ease-in-out infinite;
    }

    .art {
      position: relative;
      min-height: 420px;
      display: grid;
      place-items: center;
    }

    .art__card {
      width: min(100%, 360px);
      aspect-ratio: 1 / 1;
      border-radius: 34px;
      background:
        radial-gradient(circle at 30% 20%, rgba(230,168,107,0.18), transparent 35%),
        radial-gradient(circle at 80% 85%, rgba(255,255,255,0.08), transparent 30%),
        rgba(255,255,255,0.03);
      border: 1px solid var(--panel-border);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .doodle {
      width: 86%;
      height: auto;
      overflow: visible;
      filter: drop-shadow(0 10px 24px rgba(0,0,0,0.35));
    }

    .doodle__stroke {
      fill: none;
      stroke: #f7f3ee;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 5;
      stroke-dasharray: 700;
      stroke-dashoffset: 700;
      animation: draw 5s ease-in-out infinite;
    }

    .doodle__stroke--accent {
      stroke: var(--accent);
      animation-delay: 0.35s;
    }

    .doodle__fill {
      fill: rgba(255,255,255,0.04);
      opacity: 0;
      animation: fadeIn 5s ease-in-out infinite;
    }

    .scribble {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .scribble span {
      position: absolute;
      border-radius: 999px;
      border: 2px solid rgba(255,255,255,0.12);
      animation: float 5s ease-in-out infinite;
    }

    .scribble span:nth-child(1) {
      width: 120px;
      height: 36px;
      top: 14%;
      left: 10%;
      transform: rotate(-16deg);
      border-style: dashed;
      animation-delay: 0s;
    }

    .scribble span:nth-child(2) {
      width: 72px;
      height: 72px;
      right: 12%;
      top: 20%;
      border-width: 3px;
      animation-delay: 0.9s;
    }

    .scribble span:nth-child(3) {
      width: 180px;
      height: 22px;
      bottom: 18%;
      left: 12%;
      transform: rotate(10deg);
      border-top-left-radius: 120px;
      border-top-right-radius: 120px;
      border-bottom: 0;
      animation-delay: 1.3s;
    }

    .caption {
      margin-top: 18px;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    @keyframes draw {
      0% {
        stroke-dashoffset: 700;
        opacity: 0.4;
      }
      35% {
        opacity: 1;
      }
      60% {
        stroke-dashoffset: 0;
        opacity: 1;
      }
      100% {
        stroke-dashoffset: -700;
        opacity: 0.2;
      }
    }

    @keyframes fadeIn {
      0%, 25% { opacity: 0; }
      45%, 70% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(var(--rotate, 0deg)); }
      50% { transform: translateY(-8px) rotate(var(--rotate, 0deg)); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(0.88); }
    }

    @media (max-width: 860px) {
      .page {
        grid-template-columns: 1fr;
        padding: 20px;
      }

      .art {
        min-height: 320px;
      }

      h1 {
        font-size: clamp(2.6rem, 12vw, 4rem);
      }
    }
  </style>
</head>
<body>
  <div class="noise" aria-hidden="true"></div>

  <main class="page" aria-label="Maintenance page">
    <section class="copy">
      <div class="eyebrow">Under Maintenance</div>
      <p class="lead">
        <strong>Everything seems possible</strong>
      </p>
      <div class="note"><span aria-hidden="true"></span>Working on it</div>
    </section>

    <section class="art" aria-label="Animated doodle illustration">
      <div class="scribble" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <div class="art__card">
        <svg class="doodle" viewBox="0 0 320 320" role="img" aria-label="Animated doodle saying working on it">
          <path class="doodle__fill" d="M160 56c49.7 0 90 40.3 90 90s-40.3 90-90 90-90-40.3-90-90 40.3-90 90-90Z"/>
          <path class="doodle__stroke" d="M84 153c18-44 53-68 85-68 46 0 81 35 81 79 0 40-29 72-69 78-22 3-48-3-67-15-12-8-23-19-31-33"/>
          <path class="doodle__stroke doodle__stroke--accent" d="M74 229c15-12 31-17 47-15 18 2 34 12 50 12 21 0 35-12 47-28"/>
          <path class="doodle__stroke" d="M110 95l-16-10M126 81l-6-18M208 106l18-12M218 129l20 2M102 196l-18 12M212 194l17 13"/>
          <path class="doodle__stroke doodle__stroke--accent" d="M126 230c16 9 31 13 46 13 20 0 37-6 53-19"/>
          <path class="doodle__stroke" d="M112 147c13-10 29-15 48-15 19 0 35 5 47 15"/>
          <path class="doodle__stroke" d="M136 170c7-3 15-5 24-5 10 0 18 2 26 5"/>
        </svg>
      </div>
      <div class="caption">Working on it</div>
    </section>
  </main>
</body>
</html>
